 {t:"1 · Was bewirken Kräfte?", s:"S. 136/137", html:`
  <p><b>Alltag:</b> „Ich habe viel Kraft“ heißt: Ich bin stark.<br><b>Physik:</b> Eine Kraft kann man nicht sehen. Man erkennt sie an ihrer <b>Wirkung</b>.</p>

 {t:"3 · Auf dem Mond ist alles leichter", s:"S. 142/143", html:`

 {t:"4 · Isaac Newton", s:"S. 142/143", html:`

  <div class="gal"><figure><img src="img/s4_image2.jpg" alt="Newton und der Apfel" loading="lazy"><figcaption>Newton und der Apfel</figcaption></figure><figure><img src="img/s4_image1.jpg" alt="„Unten“ ist überall Richtung Erdmittelpunkt" loading="lazy"><figcaption>„Unten“ ist überall Richtung Erdmittelpunkt</figcaption></figure></div><p>Berühmte Geschichte: Ein Apfel fällt ins Gras – Newton fragt sich: <i>Warum fällt der Apfel auf die Erde, der Mond aber nicht?</i></p>

const store={get(k,d){try{return JSON.parse(localStorage.getItem("kraft_"+k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem("kraft_"+k,JSON.stringify(v))}catch(e){}}};
const norm=s=>s.trim().toLowerCase().replace(/\s+/g,"");

// ---------- Ansichten ----------
const V={};
V.wissen=()=>{app.innerHTML=`<div class="card"><small>Tippe ein Thema an, um es aufzuklappen.</small></div>`+WISSEN.map((w,i)=>`<details class="card" ${i==0?"open":""}><summary><b>${w.t}</b> <span class="pill">${w.s}</span></summary>${w.html}</details>`).join("")};

V.karten=()=>{let deck=shuffle(KARTEN),i=0,back=false,known=0;
 const draw=()=>{if(i>=deck.length){app.innerHTML=`<div class="card"><h2>Fertig! 🎉</h2><p>Gewusst: <b>${known}</b> von ${deck.length}</p><button class="btn" id="re">Nochmal</button></div>`;$("#re").onclick=V.karten;return}
  const c=deck[i];app.innerHTML=`<div class="card"><div class="row"><b>Karte ${i+1} / ${deck.length}</b></div><div class="bar"><i style="width:${i/deck.length*100}%"></i></div>
  <div class="card flash ${back?"back":""}" id="f">${back?c[1]:c[0]}</div><p style="text-align:center"><small>${back?"Hast du es gewusst?":"Tippe auf die Karte zum Umdrehen"}</small></p>
  ${back?`<div class="row" style="justify-content:center"><button class="btn sec" id="no">🔁 Noch üben</button><button class="btn" id="yes">👍 Gewusst</button></div>`:""}</div>`;
  $("#f").onclick=()=>{back=!back;draw()};
  if(back){$("#yes").onclick=()=>{known++;i++;back=false;draw()};$("#no").onclick=()=>{deck.push(c);i++;back=false;draw()}}};
 draw()};

V.quiz=()=>{const qs=shuffle(QUIZ).slice(0,15);let i=0,pts=0;
 const draw=()=>{if(i>=qs.length){const best=Math.max(store.get("best",0),pts);store.set("best",best);
   app.innerHTML=`<div class="card"><h2>Ergebnis</h2><p style="font-size:28px"><b>${pts} / ${qs.length}</b> richtig</p><p>${pts>=13?"Super, du bist bereit! 🌟":pts>=9?"Gut! Wiederhole noch die Lernkarten. 💪":"Lies nochmal im Wissen-Bereich nach und probier es erneut. 📘"}</p><small>Bester Versuch: ${best} / 15</small><p><button class="btn" id="re">Neues Quiz</button></p></div>`;$("#re").onclick=V.quiz;return}
  const q=qs[i],order=shuffle(q.o.map((t,k)=>k));
  app.innerHTML=`<div class="card"><b>Frage ${i+1} / ${qs.length}</b> · <small>${pts} richtig</small><div class="bar"><i style="width:${i/qs.length*100}%"></i></div><h2>${q.q}</h2>${order.map(k=>`<button class="opt" data-k="${k}">${q.o[k]}</button>`).join("")}<div id="fb"></div></div>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const k=+b.dataset.k;app.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(+x.dataset.k===q.a)x.classList.add("right")});
   if(k===q.a)pts++;else b.classList.add("wrong");
   $("#fb").innerHTML=`<div class="fb ${k===q.a?"ok":"no"}">${k===q.a?"✔ Richtig! ":"✘ Leider falsch. "}${q.e}</div><p><button class="btn" id="nx">Weiter →</button></p>`;$("#nx").onclick=()=>{i++;draw()}})};
 draw()};

V.luecke=()=>{const L=shuffle(LUECKEN);
 app.innerHTML=`<div class="card"><h2>Fülle die Lücken</h2><small>Schreib das fehlende Wort und tippe dann auf „Prüfen“.</small></div><div class="card">`+L.map((l,i)=>`<p>${l[0].replace("___",`<input type="text" class="gap" data-i="${i}" autocapitalize="off" autocomplete="off">`)}</p>`).join("")+`<div class="row"><button class="btn" id="chk">Prüfen</button><button class="btn sec" id="sol">Lösung zeigen</button><button class="btn sec" id="re">Neu mischen</button></div><div id="res"></div></div>`;
 const ins=[...app.querySelectorAll(".gap")];
 $("#chk").onclick=()=>{let r=0;ins.forEach(x=>{const ok=L[x.dataset.i][1].includes(norm(x.value));x.className="gap "+(ok?"ok":"no");if(ok)r++});$("#res").innerHTML=`<div class="fb ${r==L.length?"ok":"no"}">${r} von ${L.length} richtig.</div>`};
 $("#sol").onclick=()=>ins.forEach(x=>{const w=L[x.dataset.i][1][0];x.value=w.charAt(0).toUpperCase()+w.slice(1);x.className="gap"});
 $("#re").onclick=V.luecke};

V.rechnen=()=>{let n=0,r=0;
 const make=()=>{const kg=[1,2,3,4,5,8,10,20,50,100][Math.floor(Math.random()*10)],ort=Math.random()<.5?"Erde":"Mond",f=ort=="Erde"?10:1.6;
  return{kg,ort,ans:Math.round(kg*f*10)/10,f}};
 let t=make();
 const draw=()=>{app.innerHTML=`<div class="card"><h2>🌙 Gewichtskraft berechnen</h2><div class="merke">Erde: 1 kg → rund <b>10 N</b> &nbsp;·&nbsp; Mond: 1 kg → <b>1,6 N</b><br><small>Beispiel: 10 kg auf dem Mond → 10 × 1,6 N = 16 N</small></div>
  <p><small>${r} von ${n} richtig</small></p><h3>Wie groß ist die Gewichtskraft auf <b>${t.kg} kg</b> auf ${t.ort=="Erde"?"der <b>Erde</b> 🌍":"dem <b>Mond</b> 🌙"}?</h3>
  <div class="row"><input type="text" inputmode="decimal" id="a" style="width:140px"> <b>N</b><button class="btn" id="go">Prüfen</button></div><div id="fb"></div></div>
  <div class="card"><h3>Denk-Aufgabe</h3><p>Ein Astronaut hat 163 kg Ausrüstung. Wie groß ist die Gewichtskraft darauf auf dem Mond?</p><details><summary>Lösung anzeigen</summary><p>163 × 1,6 N = <b>260,8 N</b> (auf der Erde: rund 1630 N). Die Masse bleibt 163 kg!</p></details></div>`;
  $("#a").focus();
  const go=()=>{const v=parseFloat($("#a").value.replace(",","."));if(isNaN(v))return;n++;const ok=Math.abs(v-t.ans)<0.05;if(ok)r++;
   $("#fb").innerHTML=`<div class="fb ${ok?"ok":"no"}">${ok?"✔ Richtig!":"✘ Nicht ganz."} ${t.kg} × ${String(t.f).replace(".",",")} N = <b>${String(t.ans).replace(".",",")} N</b></div><p><button class="btn" id="nx">Nächste Aufgabe →</button></p>`;
   $("#go").disabled=true;$("#nx").onclick=()=>{t=make();draw()}};
  $("#go").onclick=go;$("#a").onkeydown=e=>{if(e.key=="Enter")go()}};
 draw()};

V.karte=()=>{const s=store.get("karte",{});
 app.innerHTML=`<div class="card"><h2>🗺️ Meine Lernlandkarte</h2><p><small>Hake ab, was du schon sicher kannst. Was noch fehlt: im Wissen-Bereich nachlesen!</small></p><div class="bar"><i id="pb"></i></div><div class="check">`+KARTE.map((k,i)=>`<label><input type="checkbox" data-i="${i}" ${s[i]?"checked":""}>${k}</label>`).join("")+`</div><p id="msg"></p></div>`;
 const upd=()=>{const c=Object.values(s).filter(Boolean).length;$("#pb").style.width=c/KARTE.length*100+"%";$("#msg").innerHTML=c==KARTE.length?"🎉 Alles abgehakt – viel Erfolg bei der Probe!":`${c} von ${KARTE.length} Zielen geschafft.`};
 app.querySelectorAll("input").forEach(x=>x.onchange=()=>{s[x.dataset.i]=x.checked;store.set("karte",s);upd()});upd()};

document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll("nav button").forEach(x=>x.classList.remove("on"));b.classList.add("on");V[b.dataset.v]();window.scrollTo(0,0)});
V.wissen();
app.addEventListener('click',e=>{const f=e.target.closest('figure');if(!f)return;const z=$('#zoom');z.querySelector('img').src=f.querySelector('img').src;z.style.display='flex'});
$('#zoom').onclick=()=>$('#zoom').style.display='none';
</script>
</body>
</html>
